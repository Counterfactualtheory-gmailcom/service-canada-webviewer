<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Canada AI Assistant — Answer Viewer</title>

  <style>
    :root {
      --wrap: 900px;
      --pad: 16px;
      --border: #cccccc;
      --accent: #ff0000;           /* ✅ Service Canada red */
      --text: #000000;
      --bg: #f2f2f2;               /* ✅ Light grey background */
      --bg-page: #f2f2f2;
      --muted: #555555;
      --link: #0f4079;             /* ✅ Matching “Write in any language” blue */
      --link-visited: #002f5c;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: var(--wrap);
      margin: 0 auto;
      padding: var(--pad);
    }

/* --- Center answer output box (same as McGill) --- */
#out {
  width: calc(100% - 30px);    /* was 60px → now wider */
  margin-left: 15px;           /* was 30px */
  margin-right: 15px;          /* was 30px */
  box-sizing: border-box;
  overflow-x: hidden;
  word-wrap: break-word;
}
    
    a {
      word-break: break-word;
      text-decoration: underline;
      color: var(--link);
    }
    a:visited { color: var(--link-visited); }
    a:hover, a:focus { opacity: 0.9; }

    #out, #out *:not(a) { color: var(--text) !important; }
    #out a { color: var(--link) !important; }
    #out a:visited { color: var(--link-visited) !important; }
    #out, #out * { background: transparent !important; }
    #out blockquote { color: var(--muted) !important; }
    #out table th, #out table td { border-color: var(--border) !important; }

/* 🔥 FIX FOR iOS CUT-OFF DESCENDERS (g, y, p, j, q, emoji, bullets) */
#out * {
  line-height: 1.4 !important;
  padding-bottom: 2px !important;
}
    
    pre, code { white-space: pre-wrap; word-break: break-word; }
    blockquote {
      margin: 0 0 1em 0;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
      color: var(--muted);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5em 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      vertical-align: top;
    }
    h1, h2, h3 {
      margin-top: 1.2em;
      color: var(--accent);
    }
    .muted { opacity: 0.9; color: var(--muted); }
    .debug {
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      margin-top: 8px;
      color: var(--accent);
      display: none;
    }

#followup-box {
  width: calc(100% - 30px);    /* match #out for perfect alignment */
  margin-left: 12px;           /* was 15px – shift left by 3px */
  margin-right: 18px;          /* was 15px – compensate right visually */
  padding: 12px;
  background: #ffffff;
  border-radius: 8px;
  border: 2px solid var(--accent);
  box-shadow: 0 0 6px rgba(255, 0, 0, 0.2);
  box-sizing: border-box;
}

/* --- Larger textarea (cleanest, safest) --- */
#followup-text {
  width: 100%;                /* fills followup-box width */
  min-height: 170px;
  padding: 14px;              /* ← increased from 10px */
  font-size: 16px;            /* ← slightly larger */
  border-radius: 6px;
  border: 1px solid #ccc;
  outline: none;
  resize: none;
  margin: 0;
  box-sizing: border-box;
  background-color: #f9f9f9;
  color: #000;
}
    
#followup-btn, #copy-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    position: relative;    /* ensure no floating */
    left: 0;               /* FIX: reset accidental shifting */
    margin-left: 0;        /* FIX: ensure full centering */
}

    #copy-btn {
      background: #0f4079;  /* ✅ Blue for bilingual “Write in any language” continuity */
      color: #fff;
    }
    #copy-btn:hover, #followup-btn:hover { opacity: 0.9; }

    /* 🔹 Animated dots */
    #loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      font-weight: 600;
      color: var(--accent);
    }
    #loading span { animation: blink 1.4s infinite both; }
    #loading span:nth-child(2) { animation-delay: 0.2s; }
    #loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/linkifyjs@4.1.3/dist/linkify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/linkifyjs@4.1.3/dist/linkify-html.min.js"></script>
  <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script>
</head>

<body>
  <div class="wrap">
    <div id="out">Waiting for content…</div>

    <div id="followup-box">
      <textarea id="followup-text" placeholder="Tap & type your next question, issue, or concern..."></textarea>
      <button id="followup-btn">Submit</button>
      <button id="copy-btn">Copy Last Answer</button>
      <div id="loading">Answer coming<span>.</span><span>.</span><span>.</span></div>
    </div>

    <div id="dbg" class="debug"></div>
  </div>

  <script>
    marked.setOptions({ gfm:true, breaks:true, mangle:false, headerIds:false });
    const outEl=document.getElementById('out');
    const dbgEl=document.getElementById('dbg');
    const showDebug=/[?&]debug=1\b/.test(location.search);
    const followupBtn=document.getElementById('followup-btn');
    const followupText=document.getElementById('followup-text');
    const copyBtn=document.getElementById('copy-btn');
    const loading=document.getElementById('loading');
    let linkHandlerAttached=false;
    let lastAnswer="";
    let lastSingleAnswer = "";

    function debug(m){if(!showDebug)return;dbgEl.style.display='block';dbgEl.textContent+=(dbgEl.textContent?'\n':'')+m;}

function safeRender(md){
  const raw = String(md || '');

  // ✅ Strip control tags from scaffolded answers
  const cleaned = raw
    .replace(/<+START\s*ANSWER[^>]*>+/gi, '')   // <<START ANSWER>> and variants
    .replace(/<+END\s*ANSWER[^>]*>+/gi, '')     // <<END ANSWER>> and variants
    .replace(/\[+COMPLETED+\]/gi, '')           // [COMPLETED]
    .replace(/\[+DONE+\]/gi, '')                // [DONE]
    .trim();

  // ✅ Render cleaned Markdown
  const html = marked.parse(cleaned || '');
  const clean1 = DOMPurify.sanitize(html, { ADD_ATTR: ['target','rel'] });

  let linked = clean1;
  try {
    if (typeof linkifyHtml === 'function') {
      linked = linkifyHtml(clean1, {
        defaultProtocol: 'https',
        nl2br: false,
        validate: { url: (v) => /^https?:\/\//i.test(v) },
        attributes: { rel: 'noopener', target: '_blank' }
      });
    }
  } catch (e) {
    debug('linkify error:' + e);
  }

const clean2 = DOMPurify.sanitize(linked, { ADD_ATTR: ['target','rel'] });
lastSingleAnswer = clean2;

// Append into the output box
if (outEl.textContent.includes('Waiting for content')) outEl.innerHTML = '';
outEl.innerHTML += (outEl.innerHTML ? '<hr>' : '') + clean2;

// ❌ IMPORTANT: do NOT store answer here anymore
// Backup is handled by the override block at the bottom
// Store ONLY the most recent clean HTML answer
window.lastAnswerBackup = clean2;

  /* -----------------------------------------------------------
     DAL–McGill DOM REFRESH BLOCK — triggers reflow & wake-up
  ----------------------------------------------------------- */
  function removeEmptyBullets() {
    const lists = document.querySelectorAll("ul, ol");
    lists.forEach(list => {
      const items = list.querySelectorAll("li");
      items.forEach(li => {
        if (!li.textContent.trim()) li.remove();
      });
      if (!list.textContent.trim()) list.remove();
    });
  }
  removeEmptyBullets();
  /* ----------------------------------------------------------- */
  
  // ✅ Normalize all links
  outEl.querySelectorAll('a').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener';
  });

  // ✅ Attach WebViewer link handler once
  if (!linkHandlerAttached) {
    outEl.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const url = a.href;
      if (/^https?:/i.test(url)) {
        e.preventDefault();
        try {
          ThunkableWebviewerExtension.postMessage('OPEN_IN_BROWSER::' + url);
        } catch (err) {
          window.location.assign(url);
        }
      }
    });
    linkHandlerAttached = true;
  }
}
    let firstMessageReceived=false;let readyPingerId=null;

// ✅ FIX: Align Service Canada render timing with McGill/DAL (prevents tag bleed)
ThunkableWebviewerExtension.receiveMessage(function (msg) {
  try {
    firstMessageReceived = true;
    if (readyPingerId) {
      clearInterval(readyPingerId);
      readyPingerId = null;
    }

    // ⏳ Add brief delay so DOM & libraries are ready before cleaning
    setTimeout(() => {
      const payload =
        msg && typeof msg === "object" && "payload" in msg
          ? msg.payload
          : msg;
      safeRender(payload);
    }, 50); // 50 ms ≈ McGill’s natural “Answer coming…” delay

  } catch (err) {
    outEl.textContent = "Render error:" + err;
    debug("Render error:" + (err && err.stack || err));
  }
});

    function pingReady(){
      try{ThunkableWebviewerExtension.postMessage('ready');}
      catch(e){debug('postMessage error:'+e);}
    }
    window.addEventListener('DOMContentLoaded',()=>{
      pingReady();
      let tries=0;
      readyPingerId=setInterval(()=>{
        if(firstMessageReceived||tries>=10){clearInterval(readyPingerId);readyPingerId=null;return;}
        pingReady();tries++;
      },600);
    });

    // ✅ Universal Copy handler
copyBtn.onclick = () => {
  // Get the most recent answer (HTML)
  const html = (lastSingleAnswer || "").trim();
  if (!html) {
      alert("No response yet to copy.");
      return;
  }

  // Convert HTML → clean plain text
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = html;

  // Convert line breaks properly
  let text = tempDiv.innerText
      .replace(/\n{3,}/g, "\n\n")  // no triple spacing
      .trim();

  try {
      navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy Last Answer"), 1500);
      });
  } catch (err) {
      // Older device fallback
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy Last Answer"), 1500);
  }
};
    followupBtn.onclick = async () => {
      const q = followupText.value.trim();
      if (!q) return;
      loading.style.display = 'block';
      followupBtn.disabled = true;
      try {
const res = await fetch('https://servicecanbackendproduction-production.up.railway.app/ask', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    question: q,
    previousQuestion: window.lastAnswerBackup || ""
  })
});
        const data = await res.json();
        safeRender(data.answer || '(no response)');
      } catch (err) {
        safeRender('⚠️ Error sending follow-up: ' + err.message);
      }
      loading.style.display = 'none';
      followupBtn.disabled = false;
      followupText.value = '';
    };

    /* ==========================================================
       ⭐ UNIVERSAL PURGE → RETURN TO INPUT SCREEN FIX
       If #out is blank after returning from background,
       navigate back to input screen (same behavior as 2× swipe-right).
    ========================================================== */
window.addEventListener("pageshow", () => {
  const out = document.getElementById("out");
  if (!out) return;

  if (out.innerHTML.trim() === "") {
    try {
      ThunkableWebviewerExtension.postMessage("NAVIGATE_INPUT");
    } catch (e) {
      const url = window.location.href.replace("index.html", "") + "index_input.html";
      window.location.replace(url);
    }
  }
});

  </script>
  
</body>
</html>
