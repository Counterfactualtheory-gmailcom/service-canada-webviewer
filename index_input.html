<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Canada AI Assistant Input</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Roboto", sans-serif;
    background-color: #f2f2f2;
    color: #FF0000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-y: auto;
  }

  header { text-align: center; margin-top: -6px; margin-bottom: 4px; }

  h1 { font-size: 20px; font-weight: 600; margin: 0; color: #FF0000; }
  .subtitle { font-size: 16px; color: #0F4079; margin-top: 5px; }

  .input-box {
    background-color: #fff;
    border: 2px solid #FF0000;
    border-radius: 12px;
    padding: 16px;
    max-width: 420px;
    width: 85%;
    box-shadow: 0 0 8px rgba(255,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    height: 65vh;
  }

  textarea {
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    resize: none;
    height: 160px;
    background-color: #f9f9f9;
    color: #444;
    margin-bottom: 12px;
  }

  button {
    background-color: #FF0000;
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover { background-color: #cc0000; }

  #toast {
    visibility: hidden;
    min-width: 220px;
    background-color: #FF0000;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 12px;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 600;
  }

  #toast.show { visibility: visible; animation: fadein .3s, fadeout .3s 2.6s; }

  @keyframes fadein { from {opacity: 0;} to {opacity: 1;} }
  @keyframes fadeout { from {opacity: 1;} to {opacity: 0;} }
</style>
</head>

<body>
<header>
  <h1>Service Canada AI Assistant</h1>
  <div class="subtitle">Write in any language</div>
</header>

<div class="input-box">
  <textarea id="inputBox" placeholder="Tap & Type your question, issue or concern here…"></textarea>
  <button id="submitBtn">Submit</button>
</div>

<div id="toast">Sent</div>

<script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script>
<script>

// 🔥 Remove: NO “back_forward reload” logic (causes breakage)

// DOM handles
const inputBox = document.getElementById("inputBox");
const submitBtn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

// Listen for ALL messages from Thunkable
ThunkableWebviewerExtension.receiveMessage(function (msg) {

  // Handshake — Thunkable asks if WebViewer is ready
  if (msg === "are_you_ready") {
    try {
      ThunkableWebviewerExtension.postMessage("ready");
    } catch (e) {
      console.log("ready handshake error:", e);
    }
    return;
  }

  // Output screen requests the previous question
  if (msg === "request_question") {
    ThunkableWebviewerExtension.postMessage({
      type: "QUESTION",
      payload: inputBox.value.trim()
    });
    return;
  }

  // IMPORTANT:
  // DO NOT block Thunkable navigation commands like “go_output”
  // We simply allow them to pass through with no action here.
});

// Toast helper
function showToast(msg) {
  toast.innerHTML = msg;
  toast.className = "show";
}

// ------------------------------------------------------------
// SUBMIT → BACKEND → SEND ANSWER TO OUTPUT SCREEN
// ------------------------------------------------------------
submitBtn.onclick = async () => {
  const q = inputBox.value.trim();
  if (!q) return;

  showToast("💬 Sending…");
  submitBtn.disabled = true;

  try {
    const res = await fetch("https://servicecanbackendproduction-production.up.railway.app/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });

    const data = await res.json();

// 🔥 FIRST: instruct Thunkable to switch screens
ThunkableWebviewerExtension.postMessage("go_output");

// 🔥 SECOND: send the answer to the output screen
ThunkableWebviewerExtension.postMessage({
  type: "ANSWER",
  payload: data.answer || "(no response)"
});

  } catch (err) {
    showToast("⚠️ Error: " + err.message);
  }

  submitBtn.disabled = false;
};

// ------------------------------------------------------------
// OPTIONAL: If Thunkable asks for current question, provide it
// ------------------------------------------------------------
ThunkableWebviewerExtension.receiveMessage(msg => {
  if (msg === "request_question") {
    ThunkableWebviewerExtension.postMessage({
      type: "QUESTION",
      payload: inputBox.value.trim()
    });
  }
});

</script>

</body>
</html>
